name: cd-staging
on:
  push:
    branches: [main]
    paths:
      - "code/server/**"
      - "code/docker/**"
      - ".github/workflows/cd-staging.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: code/server/build.gradle
      - name: Test
        working-directory: code/server
        run: ./gradlew test --no-daemon
      - name: Boot JAR
        working-directory: code/server
        run: ./gradlew bootJar --no-daemon
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        run: az acr login --name ${{ vars.ACR_NAME }}
      - name: Build and push image
        run: |
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/solitaire-api:${GITHUB_SHA}"
          docker build -f code/docker/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy staging slot
        run: |
          az webapp config container set \
            --name ${{ vars.WEBAPP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --slot staging \
            --container-image-name ${{ vars.ACR_NAME }}.azurecr.io/solitaire-api:${GITHUB_SHA}
      - name: Smoke health
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://${{ vars.WEBAPP_NAME }}-staging.azurewebsites.net/api/v1/health" | grep -q UP; then
              exit 0
            fi
            sleep 6
          done
          echo "health check failed" && exit 1
