name: cd
on:
  push:
    branches: [main]
    paths:
      - "code/server/**"
      - "code/front/**"
      - "code/docker/**"
      - "code/e2e/**"
      - "infra/**"
      - ".github/workflows/cd.yml"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: code/server/build.gradle
      - name: Gradle test
        working-directory: code/server
        run: ./gradlew test --no-daemon

  test-front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter test
        working-directory: code/front
        run: |
          flutter pub get
          flutter test

  test-e2e:
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  deploy:
    needs: [test-server, test-front, test-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/solitaire-api:${GITHUB_SHA}"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker build -f code/docker/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Update Container App
        run: |
          az containerapp update \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image "$IMAGE"
      - name: Smoke health
        run: |
          FQDN=$(az containerapp show \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "https://${FQDN}/api/v1/health"
          for i in $(seq 1 36); do
            if curl -fsS --max-time 20 "https://${FQDN}/api/v1/health" | grep -q UP; then
              HTML=$(curl -fsS --max-time 20 "https://${FQDN}/" || true)
              echo "$HTML" | grep -Eqi 'flutter|ソリティア|main.dart.js|flutter_bootstrap' || {
                echo "root page missing Flutter web bundle"
                exit 1
              }
              curl -fsS --max-time 20 -o /dev/null -w "%{http_code}" "https://${FQDN}/login" | grep -qE '200|304'
              exit 0
            fi
            echo "attempt ${i} not ready"
            sleep 10
          done
          echo "health check failed"
          az containerapp replica list \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            -o table || true
          exit 1
