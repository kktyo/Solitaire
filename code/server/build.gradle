plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.solitaire'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-sqlserver'
    implementation 'com.microsoft.sqlserver:mssql-jdbc'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mssqlserver'
}

tasks.named('test') {
    useJUnitPlatform()
}

def useExampleYmlIfMissing(String taskName, String dir) {
    tasks.named(taskName, Copy).configure {
        exclude 'application.yml.example'
        def yml = file("${dir}/application.yml")
        def example = file("${dir}/application.yml.example")
        if (!yml.exists() && example.exists()) {
            from(example) {
                rename { 'application.yml' }
            }
        }
    }
}

useExampleYmlIfMissing('processResources', 'src/main/resources')
useExampleYmlIfMissing('processTestResources', 'src/test/resources')

tasks.named('bootJar') {
    archiveFileName = 'solitaire-server.jar'
}
